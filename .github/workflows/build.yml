name: Build SIMSCAN APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V3 debug APK
        working-directory: simscan_v3
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare V3 APK
        run: cp simscan_v3/app/build/outputs/apk/debug/app-debug.apk SIMSCAN_FAST_V3.apk

      - name: Upload V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMSCAN_FAST_V3_APK
          path: SIMSCAN_FAST_V3.apk
          if-no-files-found: error
