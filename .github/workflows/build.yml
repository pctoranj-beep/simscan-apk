name: Build SIMSCAN APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android project
        shell: bash
        run: |
          cat chunks/00.txt chunks/01.txt chunks/02.txt chunks/03.txt chunks/04a.txt chunks/04b.txt chunks/04c.txt chunks/04d.txt chunks/05a.txt chunks/05b.txt chunks/05c.txt > project.b64
          base64 -d project.b64 > project.zip
          unzip -t project.zip
          unzip -q project.zip

      - name: Compatibility patch
        shell: bash
        run: |
          sed -i "s/def camerax_version = '1.6.1'/def camerax_version = '1.4.2'/" simscan_native_fast/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: simscan_native_fast
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp simscan_native_fast/app/build/outputs/apk/debug/app-debug.apk SIMSCAN_FAST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMSCAN_FAST_APK
          path: SIMSCAN_FAST.apk
          if-no-files-found: error
