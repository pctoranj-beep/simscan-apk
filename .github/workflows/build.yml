name: Build SIMSCAN APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android project v2
        shell: bash
        run: |
          cat v2chunks/00.txt v2chunks/01.txt v2chunks/02.txt v2chunks/03.txt v2chunks/04.txt > project_v2.b64
          base64 -d project_v2.b64 > project_v2.zip
          unzip -t project_v2.zip
          unzip -q -o project_v2.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: simscan_native_fast
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp simscan_native_fast/app/build/outputs/apk/debug/app-debug.apk SIMSCAN_FAST_V2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMSCAN_FAST_V2_APK
          path: SIMSCAN_FAST_V2.apk
          if-no-files-found: error
